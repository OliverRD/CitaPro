name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  supabase_flutter: ^2.15.0
  crypto: ^3.0.7
  crypt: ^4.3.1
  image_picker: ^1.2.2
  google_sign_in: ^7.2.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  webview_flutter: ^4.14.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1

# Configuración del Splash con soporte completo para Android 12+
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo_vector.svg
  android_gravity: center
  ios_content_mode: center

  # Esto obliga a las versiones modernas de Android a usar tu imagen
  android_12:
    image: assets/logo_vector.svg
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  # Secciones de recursos alineadas perfectamente
  assets:
    - assets/images/undraw_mobile-application_uc2q.svg
    - assets/images/business.png
    - assets/logo_vector.svg