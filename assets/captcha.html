<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CitaPro Captcha</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: transparent;
    }
  </style>
</head>
<body>

  <div class="cf-turnstile" data-sitekey="0x4AAAAAAAD1z2qMkhLogn2qb" data-callback="onVerify"></div>

  <script>
    // Esta función se ejecuta AUTOMÁTICAMENTE cuando Cloudflare valida al usuario
    function onVerify(token) {
      window.onCaptchaVerified.postMessage(token);
    }
  </script>

</body>
</html>
